<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rädda Valpen</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <main class="stage">
    <h1 id="title">Rädda valpen innan det är för sent!</h1>
    <p class="timer">Tid kvar: <span id="countdown">20</span> s</p>

    <div class="guillotine">
      <div class="beam"></div>
      <div class="post post--left"></div>
      <div class="post post--right"></div>
      <div id="blade" class="blade">
        <div class="blade__weight"></div>
        <div class="blade__steel"></div>
      </div>
      <div class="lunette lunette--top"></div>
      <div class="lunette lunette--bottom"></div>
      <div class="puppy" aria-label="Hundvalp">🐶</div>
      <div class="base"></div>
      <div class="basket"></div>
    </div>

    <button id="save-button" class="save-button">Rädda hundvalp</button>
    <p class="stats">Stängda popups: <span id="closed-count">0</span></p>
  </main>

  <div id="popup-layer" class="popup-layer"></div>

  <div id="result" class="result" hidden></div>

  <script src="index.js"></script>
</body>
</html>
